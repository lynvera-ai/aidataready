[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lynvera-aidataready"
version = "0.1.0"
description = "Local data readiness checks for AI, RAG, ML, and agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{name = "Ph.D. Felipe Castillo Rendón", email = "felipe.castillo@lynvera.ai"}]
dependencies = [
  "pydantic>=2.10,<3", "typer>=0.15,<1", "rich>=13.9,<15",
  "pandas>=2.2,<3", "SQLAlchemy>=2.0,<3", "pyarrow>=18,<24",
  "PyYAML>=6,<7", "ijson>=3.3,<4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
pandera = ["pandera[pandas]>=0.26,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "mypy>=1.15,<2", "pandas-stubs>=2.2,<3", "types-PyYAML>=6", "build>=1,<2", "pip-licenses>=5,<6"]

[project.scripts]
aidataready = "lynvera_aidataready.cli:app"

[project.urls]
Homepage = "https://aidataready.lynvera.ai"
Documentation = "https://github.com/lynvera-ai/aidataready/blob/main/docs/README.md"
Repository = "https://github.com/lynvera-ai/aidataready"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires a disposable PostgreSQL database"]

[tool.coverage.run]
source = ["lynvera_aidataready"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.hatch.build.targets.wheel]
packages = ["src/lynvera_aidataready"]

[tool.hatch.build.targets.sdist]
exclude = ["/website"]
