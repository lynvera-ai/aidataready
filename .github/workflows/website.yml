name: Website
on:
  pull_request:
    paths: ["website/**", "pyproject.toml", ".github/workflows/website.yml"]
  push:
    branches: ["web/aidataready-site", main]
    paths: ["website/**", "pyproject.toml", ".github/workflows/website.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm --prefix website run release
      - uses: actions/upload-artifact@v4
        with:
          name: aidataready-site
          path: website/dist
          retention-days: 7
